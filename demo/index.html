const ACT_TEXT = {"fallback": "In NOI this opens its own form. Nothing is saved in the demo.", "demo": "Demo — nothing is saved", "close": "Close"};
const actLabel = b => [...b.childNodes].filter(n => n.nodeType === 3).map(n => (n.__en !== undefined ? n.__en : n.nodeValue)).join('').replace(/\s+/g, ' ').trim();
function actCtx(b, kind) {
  const txt = el => (el ? el.textContent.replace(/\s+/g, ' ').trim() : '');
  const near = sel => b.closest(sel);
  if (kind === 'card') { const c = near('.tcard, .srv'); return c ? [txt(c.querySelector('b')), txt(c.querySelector('.mut')), txt(c.querySelector('.chip'))].filter(Boolean).join(' · ') : ''; }
  if (kind === 'person') { const r = near('.prow, .row, tr'); return txt(r && r.querySelector('b')); }
  if (kind === 'status') return txt(document.querySelector('.namegrid .on'));
  if (kind === 'panel') { const p = near('.panel'); return txt(p && p.querySelector('.ph3, h3')); }
  if (kind === 'h2') return txt(document.querySelector('.prof h2'));
  if (kind === 'tl') { const r = near('.tl'), t = r && r.children[2]; return t ? (t.firstChild && t.firstChild.nodeType === 3 ? t.firstChild.nodeValue : txt(t)).trim() : ''; }
  if (kind === 'row') { const r = near('.row'); return txt(r && r.firstElementChild); }
  if (kind === 'b') { const r = near('.aprow, tr, .tcard, .prow'); return r ? [txt(r.querySelector('b')), txt(r.querySelector('.sub, small'))].filter(Boolean).join(' · ') : ''; }
  if (kind === 'tcard' || kind === 'mcard') { const c = near(kind === 'tcard' ? '.tcard' : '.m-card'); return txt(c && c.querySelector('b')); }
  return '';
}
function actHTML(a, ctx) {
  const fld = ([l, v, k]) => `<div class="fld${k === 'area' || k === 'areav' ? ' wide' : ''}"><label>${l}</label><div class="inp${k === 'area' || k === 'areav' ? ' area' : ''}">${k === 'sel' ? v + ' <span class="mut">▾</span>' : k === 'ph' || k === 'area' ? `<span class="mut">${v}</span>` : v}</div></div>`;
  const sub = ctx || a.sub;
  return `<div class="dlg-h"><div><h3 id="dlgH">${a.title}</h3>${sub ? `<p class="mut">${sub}</p>` : ''}</div><button class="dlg-x" data-dlg="close" aria-label="${ACT_TEXT.close}">${ICON.x}</button></div>`
    + (a.n ? `<p class="dlg-n">${a.n}</p>` : '')
    + (a.r ? `<div class="list">${a.r.map(([l, v]) => `<div class="row"><span class="mut">${l}</span><b>${v}</b></div>`).join('')}</div>` : '')
    + (a.o ? `<div>${a.o.map(([l, on]) => `<div class="set-row"><span>${l}</span><span class="radio${on ? ' on' : ''}"></span></div>`).join('')}</div>` : '')
    + (a.f ? `<div class="form">${a.f.map(fld).join('')}</div>` : '')
    + (a.pins ? `<div class="pins dlg-pins">${'<i></i>'.repeat(a.pins)}</div>` : '')
    + (a.t ? `<div>${a.t.map(([l, on]) => `<div class="set-row"><span>${l}</span><span class="tog${on ? ' on' : ''}"></span></div>`).join('')}</div>` : '')
    + `<div class="row-btns dlg-btns">${a.ok === 'Done' || a.ok === 'OK' ? '' : '<button class="btn" data-dlg="close">Cancel</button>'}<button class="btn primary" data-dlg="ok">${a.ok}</button></div>`;
}
function closeAct() { document.querySelectorAll('.dlg-wrap').forEach(x => x.remove()); }
function toast(msg) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div');
  t.className = 'toast';
  t.setAttribute('role', 'status');
  t.innerHTML = `${ICON.check}<span>${msg}</span><small>${ACT_TEXT.demo}</small>`;
  document.body.append(t);
  setTimeout(() => t.classList.add('out'), 2600);
  setTimeout(() => t.remove(), 3000);
}
function openAct(b) {
  const label = actLabel(b), screen = location.hash.replace(/^#/, '');
  const a = ACTS[label + '@' + screen] || ACTS[label] || { title: label, n: ACT_TEXT.fallback, ok: 'OK' };
  if (a.go) { location.hash = a.go; return; }
  if (a.toast) { toast(a.toast); return; }
  closeAct();
  const w = document.createElement('div');
  w.className = 'dlg-wrap';
  w.innerHTML = `<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgH">${actHTML(a.title === '' ? { ...a, title: b.textContent.trim() } : a, actCtx(b, a.ctx))}</div>`;
  w.addEventListener('click', e => {
    if (e.target === w) { closeAct(); return; }
    const c = e.target.closest('[data-dlg]');
    if (c) { closeAct(); if (c.dataset.dlg === 'ok' && a.done) toast(a.done); return; }
    const row = e.target.closest('.set-row');
    if (!row) return;
    const r = row.querySelector('.radio'), t = row.querySelector('.tog');
    if (r) row.parentElement.querySelectorAll('.radio').forEach(x => x.classList.toggle('on', x === r));
    if (t) t.classList.toggle('on');
  });
  document.body.append(w);
  w.querySelector('[data-dlg="ok"]').focus({ preventScroll: true });
}
document.addEventListener('click', e => {
  const b = e.target.closest('#content .btn, #content .bigbtn');
  if (b && !b.closest('a')) { e.preventDefault(); openAct(b); return; }
  // The phone's tab bar switches screens; tabs, segments and filter chips just move their highlight.
  const tab = e.target.closest('#content .tabbar span');
  if (tab) { location.hash = ['app-shifts', 'app-request', 'app-messages', 'app-earnings'][[...tab.parentElement.children].indexOf(tab)]; return; }
  const pick = e.target.closest('#content .toolbar:not(.map-filter) .fchip, #content .seg span, #content .tabs span, #content .namegrid span');
  if (pick) [...pick.parentElement.children].filter(x => x.tagName === pick.tagName && x.className.replace(' on', '') === pick.className.replace(' on', '')).forEach(x => x.classList.toggle('on', x === pick));
});
document.addEventListener('keydown', e => {
  if (!document.querySelector('.dlg-wrap')) return;
  if (e.key === 'Escape') closeAct();
  if (e.key === 'Escape' || e.key.startsWith('Arrow')) e.stopImmediatePropagation();
}, true);

  take: ['Take the tour', 'Пройти тур'], tour: ['Tour', 'Тур'], resume: ['Resume the tour', 'Продолжить тур'],
  back: ['Back', 'Назад'], next: ['Next', 'Далее'], finish: ['Finish', 'Завершить'], close: ['Close the tour', 'Закрыть тур'],
  play: ['Play automatically', 'Автопрокрутка'], pause: ['Pause', 'Пауза'], of: ['of', 'из'],
  all: ['All products', 'Все продукты'], allWho: ['Eleven products on four kinds of device', '11 продуктов на четырёх типах устройств'],
};
const INTRO = {
  badge: ['Demo · sample data', 'Демо · тестовые данные'],
  h1: ['The operating system for a nightclub', 'Операционная система для ночного клуба'],
  p: ['One system for the floor, the stage, the cash desk and the money. Everything here is clickable and runs on sample data.',
    'Одна система для зала, сцены, кассы и денег. Здесь всё кликается и работает на тестовых данных.'],
  pts: [['layout-dashboard', ['Live.', 'Вживую.'], ['Everything updates as it happens.', 'Всё обновляется в моменте.']],
    ['wallet', ['Accountable.', 'Под контролем.'], ['The money checks itself against the till.', 'Деньги сами сверяются с кассой.']],
    ['smartphone', ['Everywhere.', 'Везде.'], ['Computer, tablet and phone, one system.', 'Компьютер, планшет и телефон — одна система.']]],
  start: ['Start the tour', 'Начать тур'], explore: ['Explore on my own', 'Изучить самостоятельно'],
  move: ['to move', 'листать'], auto: ['autoplay', 'автопрокрутка'], esc: ['to close', 'закрыть'],
  route: ['What you’ll see', 'Что вы увидите'], meta: ['8 stops · about 2 min', '8 шагов · около 2 минут'],
};
const END = {
  h1: ['That’s NOI', 'Это NOI'],
  p: ['Eleven products on one platform, built around how a club actually runs a night. Every screen stays open to explore.',
    'Одиннадцать продуктов на одной платформе, построенной вокруг того, как клуб на самом деле живёт ночью. Все экраны открыты — изучайте.'],
  offer: ['Back to the offer', 'Вернуться к предложению'], explore: ['Explore on my own', 'Изучить самостоятельно'],
  restart: ['Restart the tour', 'Пройти тур заново'],
};

const tour = { at: -1, shown: -1, play: false, prog: 0, away: false, pending: false, side: '', raf: 0, last: 0,
  cur: null, from: null, t0: 0, pos: null, posFrom: null, size: null, vw: 0, vh: 0, radius: 16, key: '' };
const SPOT_PAD = 10, GAP = 18, EDGE = 12, MOVE = 640;
const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const isSheet = () => innerWidth <= 760;
const tRect = (x, y, w, h) => ({ x, y, w, h });
const tMix = (a, b, k) => tRect(a.x + (b.x - a.x) * k, a.y + (b.y - a.y) * k, a.w + (b.w - a.w) * k, a.h + (b.h - a.h) * k);
const tEase = k => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
const tClamp = (v, a, b) => Math.max(a, Math.min(b, v));
const tOverlap = (a, b) => Math.max(0, Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x)) * Math.max(0, Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y));
const stopProduct = st => PRODUCTS.find(p => st.id.startsWith(p.id + '-'));
const stopColor = st => { const p = stopProduct(st); return p ? PCOLOR[p.id] : AMBER; };
const stopDur = st => st.dur || tClamp(3800 + (tx(st.title) + tx(st.text) + (st.watch ? tx(st.watch) : '')).length * 34, 7000, 12500);

function tourBtn() {
  const label = tour.at < 0 ? tx(TT.take) : tx(tour.away ? TT.resume : TT.tour) + ' · ' + (tour.at + 1) + ' / ' + TOUR.length;
  return `<button class="btn primary tour-btn" id="tourBtn" data-tour="${tour.at < 0 ? 'start' : 'resume'}">${ICON.play}<span class="lbl">${label}</span></button>`;
}
function syncTourBtn() { const b = $('tourBtn'); if (b) b.outerHTML = tourBtn(); }

function tourLayer() {
  let el = $('tourLayer');
  if (el) return el;
  el = document.createElement('div');
  el.className = 'tour';
  el.id = 'tourLayer';
  el.innerHTML = '<div class="tour-block"></div><div class="tour-spot"></div><section class="tour-card" role="dialog" aria-live="polite"></section>';
  document.body.append(el);
  const card = el.querySelector('.tour-card');
  // A click outside the card does nothing but remind where the controls are.
  el.querySelector('.tour-block').addEventListener('click', () => { card.classList.remove('enter', 'nudge'); void card.offsetWidth; card.classList.add('nudge'); });
  return el;
}

function tourStart(i = 0) {
  closeModal();
  $('app').classList.remove('open');
  Object.assign(tour, { play: false, shown: -1, cur: null, pos: null, posFrom: null, away: false });
  tourGo(i);
}
function tourGo(i) {
  tour.at = i;
  tour.prog = 0;
  const st = TOUR[i];
  if (st.clock) stage.left = st.clock;
  if (location.hash.replace(/^#/, '') === st.id) tourPaint();
  else { tour.pending = true; location.hash = st.id; }
}
function tourStep(d) {
  const i = tour.at + d;
  if (i < 0) return;
  if (i >= TOUR.length) tourEnd(true); else tourGo(i);
}
function tourEnd(finished) {
  const el = $('tourLayer');
  Object.assign(tour, { at: -1, shown: -1, play: false, away: false, pending: false, cur: null, pos: null, posFrom: null });
  cancelAnimationFrame(tour.raf);
  tour.raf = 0;
  document.body.classList.remove('touring');
  if (el) { el.id = ''; el.classList.add('out'); setTimeout(() => el.remove(), 320); }
  syncTourBtn();
  if (finished) setTimeout(() => showModal('end'), reduced() ? 0 : 200);
}
function tourPlay(on) {
  tour.play = on;
  tour.last = performance.now();
  const el = $('tourLayer');
  if (!el) return;
  el.classList.toggle('playing', on);
  const b = el.querySelector('.tc-play');
  if (!b) return;
  b.innerHTML = on ? ICON.pause : ICON.play;
  b.setAttribute('aria-label', tx(on ? TT.pause : TT.play));
  b.setAttribute('aria-pressed', String(on));
  b.title = tx(on ? TT.pause : TT.play) + ' (P)';
}

// Called after every render: shows the stop, or steps aside if the visitor has gone to another screen.
function tourPaint() {
  if (tour.at < 0) return;
  const st = TOUR[tour.at], el = tourLayer();
  tour.pending = false;
  tour.away = location.hash.replace(/^#/, '') !== st.id;
  el.classList.toggle('away', tour.away);
  document.body.classList.toggle('touring', !tour.away);
  syncTourBtn();
  if (tour.away) return;
  const fresh = tour.shown !== tour.at;
  fillCard(st);
  tour.shown = tour.at;
  const target = document.querySelector(st.focus);
  tour.radius = (target ? parseFloat(getComputedStyle(target).borderTopLeftRadius) || 0 : 6) + SPOT_PAD;
  tour.from = tour.cur || tRect(0, 0, innerWidth, innerHeight);
  tour.posFrom = tour.pos;
  tour.side = '';
  tour.t0 = performance.now();
  if (fresh) scrollToStop(st);
  if (!tour.raf) tour.raf = requestAnimationFrame(tourFrame);
}

function fillCard(st) {
  const card = $('tourLayer').querySelector('.tour-card'), i = tour.at, last = i === TOUR.length - 1, p = stopProduct(st);
  card.style.setProperty('--c', stopColor(st));
  card.setAttribute('aria-label', tx(TT.tour) + ' ' + (i + 1) + ' ' + tx(TT.of) + ' ' + TOUR.length);
  card.innerHTML = '<i class="tc-arrow" aria-hidden="true"></i>'
    + `<div class="tc-top"><span class="tc-ico">${ICON[st.icon]}</span><span class="tc-eye"><b>${p ? p.name : tx(TT.all)}</b><span>${p ? p.who : tx(TT.allWho)}</span></span>`
    + `<button class="tc-x" data-tour="exit" aria-label="${tx(TT.close)}" title="${tx(TT.close)} (Esc)">${ICON.x}</button></div>`
    + `<div class="tc-body"><h3>${tx(st.title)}</h3><p>${tx(st.text)}</p>${st.watch ? `<div class="tc-watch"><i></i><span>${tx(st.watch)}</span></div>` : ''}</div>`
    + `<div class="tc-segs">${TOUR.map((x, k) => `<button class="tc-seg${k < i ? ' done' : k === i ? ' on' : ''}" data-tour="seg" data-i="${k}" aria-label="${k + 1}. ${tx(x.short)}"><i></i><span>${tx(x.short)}</span></button>`).join('')}</div>`
    + `<div class="tc-foot"><span class="tc-n"><b>${i + 1}</b> / ${TOUR.length}</span><button class="tc-play" data-tour="play"></button><span class="grow"></span>`
    + `<button class="btn" data-tour="back"${i ? '' : ' disabled'}>${ICON['arrow-left']}${tx(TT.back)}</button>`
    + `<button class="btn primary" data-tour="next">${tx(last ? TT.finish : TT.next)}${last ? ICON.check : ICON['arrow-right']}</button></div>`;
  tourPlay(tour.play);
  if (!tour.pos) { card.classList.remove('enter', 'nudge'); void card.offsetWidth; card.classList.add('enter'); }
  card.querySelector('[data-tour="next"]').focus({ preventScroll: true });
  tour.size = { w: card.offsetWidth, h: card.offsetHeight };
  document.documentElement.style.setProperty('--tour-pad', Math.round(tour.size.h + GAP + 24) + 'px');
}

// Bring the stop into view: centred when the card fits beside it, high enough for the card when it has to go underneath.
function scrollToStop(st) {
  const el = document.querySelector(st.focus);
  if (!el) return;
  const r = el.getBoundingClientRect(), vh = innerHeight, vw = innerWidth, sheet = isSheet();
  const top = ($('top') ? $('top').getBoundingClientRect().height : 0) + SPOT_PAD + 8;
  const cw = tour.size ? tour.size.w : 376, ch = tour.size ? tour.size.h : 260;
  const room = (sheet ? vh - ch - 22 : vh - EDGE) - top, h = r.height + SPOT_PAD;
  const beside = !sheet && (r.right + SPOT_PAD + GAP + cw <= vw - EDGE || r.left - SPOT_PAD - GAP - cw >= EDGE);
  let y;
  if (h > room) y = r.top - top;
  else if (beside || sheet) y = r.top - top - (room - h) / 2;
  else y = r.top - top - Math.max(0, (room - h - GAP - ch) / 2);
  const to = tClamp(scrollY + y, 0, Math.max(0, document.documentElement.scrollHeight - vh));
  if (Math.abs(to - scrollY) > 2) window.scrollTo({ top: to, behavior: reduced() ? 'auto' : 'smooth' });
}

// Beside the stop if there is room (right, below, left, above), else the corner that covers the least of it.
function placeCard(S, cw, ch) {
  const vw = innerWidth, vh = innerHeight;
  const x0 = Math.max(S.x, 0), y0 = Math.max(S.y, 0);
  let vis = tRect(x0, y0, Math.min(S.x + S.w, vw) - x0, Math.min(S.y + S.h, vh) - y0);
  if (vis.w <= 0 || vis.h <= 0) vis = S;
  const midY = () => tClamp(vis.y + vis.h / 2 - ch / 2, EDGE, vh - EDGE - ch);
  const alignX = () => tClamp(vis.w >= cw ? vis.x : vis.x + vis.w / 2 - cw / 2, EDGE, vw - EDGE - cw);
  const fits = {
    right: () => { const x = S.x + S.w + GAP; return x + cw <= vw - EDGE ? { x, y: midY() } : null; },
    left: () => { const x = S.x - GAP - cw; return x >= EDGE ? { x, y: midY() } : null; },
    bottom: () => { const y = S.y + S.h + GAP; return y + ch <= vh - EDGE ? { x: alignX(), y } : null; },
    top: () => { const y = S.y - GAP - ch; return y >= EDGE ? { x: alignX(), y } : null; },
  };
  for (const side of [tour.side, 'right', 'bottom', 'left', 'top']) {
    const p = side && fits[side]();
    if (!p) continue;
    tour.side = side;
    const vert = side === 'right' || side === 'left';
    const along = vert ? vis.y + vis.h / 2 - p.y : (vis.w >= cw ? 34 : vis.x + vis.w / 2 - p.x);
    return { x: p.x, y: p.y, side, a: tClamp(along, 26, (vert ? ch : cw) - 26) };
  }
  tour.side = '';
  let best = null;
  for (const [x, y] of [[vw - EDGE - cw, vh - EDGE - ch], [EDGE, vh - EDGE - ch], [vw - EDGE - cw, EDGE], [EDGE, EDGE]]) {
    const o = tOverlap(tRect(x, y, cw, ch), vis);
    if (!best || o < best.o) best = { x, y, o };
  }
  return { x: best.x, y: best.y, side: 'none', a: null };
}

// One frame: the spotlight eases to the stop and then follows it while the page scrolls; the card does the same.
function tourFrame(now) {
  tour.raf = 0;
  if (tour.at < 0) return;
  tour.raf = requestAnimationFrame(tourFrame);
  const el = $('tourLayer');
  if (!el || tour.away || tour.pending) { tour.last = now; return; }
  const st = TOUR[tour.at], spot = el.querySelector('.tour-spot'), card = el.querySelector('.tour-card');
  if (tour.vw !== innerWidth || tour.vh !== innerHeight) { tour.vw = innerWidth; tour.vh = innerHeight; tour.size = { w: card.offsetWidth, h: card.offsetHeight }; }
  const target = document.querySelector(st.focus);
  let goal = tRect(innerWidth / 2, innerHeight / 2, 0, 0);
  if (target) { const r = target.getBoundingClientRect(); goal = tRect(r.left - SPOT_PAD, r.top - SPOT_PAD, r.width + 2 * SPOT_PAD, r.height + 2 * SPOT_PAD); }
  const k = reduced() ? 1 : tEase(tClamp((now - tour.t0) / MOVE, 0, 1));
  const cur = k < 1 && tour.from ? tMix(tour.from, goal, k) : goal;
  tour.cur = cur;
  let pos = null, place = null;
  if (!isSheet()) {
    place = placeCard(goal, tour.size.w, tour.size.h);
    pos = k < 1 && tour.posFrom ? { x: tour.posFrom.x + (place.x - tour.posFrom.x) * k, y: tour.posFrom.y + (place.y - tour.posFrom.y) * k } : place;
  }
  tour.pos = pos;
  const side = place && !(k < 1 && tour.posFrom) ? place.side : 'none';
  const key = [cur.x, cur.y, cur.w, cur.h, pos && pos.x, pos && pos.y, side, place && place.a].map(v => (typeof v === 'number' ? Math.round(v) : v)).join();
  if (key !== tour.key) {
    tour.key = key;
    spot.style.transform = `translate3d(${cur.x}px, ${cur.y}px, 0)`;
    spot.style.width = cur.w + 'px';
    spot.style.height = cur.h + 'px';
    spot.style.borderRadius = tour.radius + 'px';
    card.style.transform = pos ? `translate3d(${Math.round(pos.x)}px, ${Math.round(pos.y)}px, 0)` : '';
    card.dataset.side = side;
    if (place && place.a != null) card.style.setProperty('--a', Math.round(place.a) + 'px');
  }
  // Autoplay: the current segment fills, then the tour moves on. Leaving the tab pauses it.
  if (tour.play && !document.hidden) {
    tour.prog += (now - (tour.last || now)) / stopDur(st);
    if (tour.prog >= 1) { tour.last = now; tourStep(1); return; }
  }
  tour.last = now;
  const seg = card.querySelector('.tc-seg.on');
  if (seg) seg.style.setProperty('--p', (tour.prog * 100).toFixed(2) + '%');
}

// The opening card on a first visit, and the closing card at the end of the tour.
function showModal(kind) {
  closeModal();
  const m = document.createElement('div');
  m.className = 'intro';
  m.innerHTML = kind === 'end' ? endCard() : introCard();
  m.addEventListener('click', e => { if (e.target === m) closeModal(); });
  document.body.append(m);
  const first = m.querySelector('[data-tour="start"], .btn.offer');
  if (first) first.focus({ preventScroll: true });
}
function introCard() {
  return '<div class="intro-card wide" role="dialog" aria-modal="true" aria-labelledby="introH">'
    + `<div class="ic-hero"><div class="ic-brand"><span class="ic-mark">NOI</span>${chip(tx(INTRO.badge))}<span class="grow"></span>${langSwitch()}</div>`
    + `<h1 id="introH">${tx(INTRO.h1)}</h1><p>${tx(INTRO.p)}</p>`
    + `<div class="ic-pts">${INTRO.pts.map(([icon, b, t]) => `<div><i>${ICON[icon]}</i><span><b>${tx(b)}</b> ${tx(t)}</span></div>`).join('')}</div>`
    + `<div class="ic-btns"><button class="btn primary big" data-tour="start">${ICON.play}${tx(INTRO.start)}</button><button class="btn big" data-tour="explore">${tx(INTRO.explore)}</button></div>`
    + `<div class="ic-keys"><kbd>←</kbd><kbd>→</kbd><span>${tx(INTRO.move)}</span><kbd>P</kbd><span>${tx(INTRO.auto)}</span><kbd>Esc</kbd><span>${tx(INTRO.esc)}</span></div></div>`
    + `<div class="ic-route"><h2>${tx(INTRO.route)}<span>${tx(INTRO.meta)}</span></h2>`
    + TOUR.map((st, k) => { const p = stopProduct(st); return `<button class="ic-stop" data-tour="startAt" data-i="${k}" style="--c:${stopColor(st)}"><span class="n">${String(k + 1).padStart(2, '0')}</span><span class="t">${ICON[st.icon]}</span><span><b>${tx(st.short)}</b><small>${p ? p.name : tx(TT.all)}</small></span>${ICON['chevron-right']}</button>`; }).join('')
    + '</div></div>';
}
function endCard() {
  return '<div class="intro-card end" role="dialog" aria-modal="true" aria-labelledby="introH">'
    + `<div class="ic-done">${ICON.check}</div><div class="ic-head"><h1 id="introH">${tx(END.h1)}</h1><p>${tx(END.p)}</p></div>`
    + `<div class="ic-recap">${TOUR.map((st, k) => `<button data-tour="goto" data-i="${k}" style="--c:${stopColor(st)}"><span class="t">${ICON[st.icon]}</span><span><b>${tx(st.title)}</b><small>${tx(st.short)}</small></span></button>`).join('')}</div>`
    + `<div class="ic-cta"><a class="btn big offer" href="${backHref()}">${ICON['arrow-left']}${tx(END.offer)}</a><button class="btn big" data-tour="explore">${tx(END.explore)}</button>`
    + `<span class="grow"></span><button class="btn big ghost" data-tour="start">${ICON['rotate-ccw']}${tx(END.restart)}</button></div></div>`;
}
function closeModal() { const m = document.querySelector('.intro'); if (m) m.remove(); }

document.addEventListener('click', e => {
  const a = e.target.closest('[data-tour]');
  if (!a || a.disabled) return;
  const k = a.dataset.tour, i = +a.dataset.i;
  if (k === 'start') tourStart(0);
  else if (k === 'startAt') tourStart(i);
  else if (k === 'resume') { if (tour.at >= 0) tourGo(tour.at); else tourStart(0); }
  else if (k === 'next') tourStep(1);
  else if (k === 'back') tourStep(-1);
  else if (k === 'seg') { if (i !== tour.at) tourGo(i); }
  else if (k === 'play') tourPlay(!tour.play);
  else if (k === 'exit') tourEnd(false);
  else if (k === 'explore') closeModal();
  else if (k === 'goto') { closeModal(); location.hash = TOUR[i].id; }
});
document.addEventListener('visibilitychange', () => { tour.last = performance.now(); });

// Switching language: the thumb slides first, then the page re-renders in place, keeping the screen and the tour stop.
function setLang(l, sw) {
  if (l === lang) return;
  if (sw) sw.dataset.on = l;
  setTimeout(() => {
    lang = l;
    const q = new URLSearchParams(location.search);
    if (l === 'en') q.set('lang', 'en'); else q.delete('lang');
    history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : '') + location.hash);
    document.documentElement.lang = l;
    document.title = tx(TITLE);
    if (l === 'ru') trNode(document.body); else unNode(document.body);
    const y = scrollY, m = document.querySelector('.intro');
    route();
    window.scrollTo(0, y);
    if (m) showModal(m.querySelector('.end') ? 'end' : 'intro');
    $('backOffer').href = backHref();
  }, sw && !reduced() ? 180 : 0);
}
document.addEventListener('click', e => { const b = e.target.closest('[data-lang]'); if (b) setLang(b.dataset.lang, b.closest('.lang')); });

document.documentElement.lang = lang;
document.title = tx(TITLE);
ruWatch.observe(document.body, { childList: true, subtree: true, characterData: true });
if (lang === 'ru') trNode(document.body);
window.addEventListener('hashchange', route);
route();
$('backOffer').href = backHref();
// A first visit with no screen in the link opens with the intro; #tour starts the tour straight away.
if (location.hash === '#tour') tourStart();
else if (!location.hash) showModal('intro');
</script>
</body>
</html>
