<html lang="ru">

<style>
:root {
  color-scheme: dark;
  --bg: #0e0f11; --panel: #16171b; --panel-2: #1d1f24;
  --line: rgba(255, 255, 255, 0.08); --line-2: rgba(255, 255, 255, 0.14);
  --ink: #ededeb; --ink-2: #b8bbc2; --muted: #7f848e;
  --amber: #f2a93b; --amber-wash: rgba(242, 169, 59, 0.14);
  --green: #4cc38a; --red: #ef6461; --blue: #5aa1f0; --violet: #a58bf0;
  --font: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 400 14px/1.5 var(--font); }
a { color: inherit; }
svg { width: 16px; height: 16px; flex: none; }

.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
.rail { background: #0a0b0c; border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; padding: 14px 0; gap: 4px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.logo { font-weight: 800; letter-spacing: 0.14em; color: var(--amber); margin-bottom: 10px; font-size: 15px; }
.rail a { width: 66px; display: grid; justify-items: center; gap: 3px; padding: 8px 2px; border-radius: 12px; color: var(--muted); text-decoration: none; font-size: 10.5px; font-weight: 600; text-align: center; line-height: 1.15; }
.rail a svg { width: 20px; height: 20px; }
.rail a:hover { color: var(--ink); background: rgba(255, 255, 255, 0.04); }
.rail a.on { color: var(--amber); background: var(--amber-wash); }
.rail .sp { flex: 1; min-height: 12px; }
.side { background: var(--panel); border-right: 1px solid var(--line); padding: 16px 12px 14px; position: sticky; top: 0; height: 100vh; overflow: hidden; display: flex; flex-direction: column; gap: 12px; }
.side h2 { font-size: 15px; margin: 0 0 4px; }
.side .who { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
.dev { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--ink-2); border: 1px solid var(--line-2); border-radius: 999px; padding: 3px 9px; margin-bottom: 12px; }
.dev svg { width: 13px; height: 13px; }
.side nav { display: grid; gap: 1px; }
.side nav a { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 9px; color: var(--ink-2); text-decoration: none; font-size: 13px; }
.side nav a:hover { background: rgba(255, 255, 255, 0.04); color: var(--ink); }
.side nav a.on { background: var(--amber-wash); color: var(--ink); font-weight: 700; }
.side nav a i { font-style: normal; font-size: 10.5px; color: var(--muted); border: 1px solid var(--line-2); border-radius: 999px; padding: 0 6px; }
.side .count { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
.tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: rgba(165, 139, 240, 0.16); color: #c9b8ff; margin-left: 8px; vertical-align: middle; }

.main { min-width: 0; display: flex; flex-direction: column; }
.top { display: flex; align-items: center; gap: 10px; padding: 11px 22px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: rgba(14, 15, 17, 0.92); backdrop-filter: blur(8px); z-index: 5; }
.crumb { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crumb b { color: var(--ink); font-weight: 700; }
.club { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; padding: 6px 10px; border-radius: 9px; background: var(--panel); border: 1px solid var(--line); }
.club::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
.grow { flex: 1; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); background: var(--panel-2); color: var(--ink); border-radius: 9px; padding: 7px 12px; font: 600 12.5px var(--font); cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn svg { width: 15px; height: 15px; }
.btn:hover { border-color: rgba(255, 255, 255, 0.24); }
.btn.primary { background: var(--amber); border-color: var(--amber); color: #1a1205; }
.btn.big { padding: 14px 20px; font-size: 15px; }
.btn.full { display: flex; justify-content: center; width: 100%; padding: 12px; }
.btn.menu-btn { display: none; }
.counter { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.content { padding: 22px 26px 48px; }
.head h1 { font-size: 22px; margin: 0 0 4px; font-weight: 800; letter-spacing: -0.01em; }
.head p { margin: 0 0 18px; color: var(--ink-2); max-width: 70ch; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.panel.flush { padding: 4px 8px; overflow-x: auto; }
.ph3 { font-size: 13px; margin: 0 0 8px; color: var(--ink-2); font-weight: 700; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 14px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.tile span { color: var(--muted); font-size: 12px; }
.tile b { display: block; font-size: 22px; margin-top: 4px; font-variant-numeric: tabular-nums; }
.cols2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.cols-main { display: grid; grid-template-columns: minmax(0, 1fr) 310px; gap: 14px; align-items: start; }
.mt { margin-top: 14px; } .mt8 { margin-top: 10px; }
.mut { color: var(--muted); }
.ph { display: inline-block; height: 8px; width: 60%; border-radius: 4px; background: rgba(255, 255, 255, 0.1); }
.list .row { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); gap: 10px; }
.list .row:last-child { border-bottom: 0; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: rgba(255, 255, 255, 0.07); color: var(--ink-2); white-space: nowrap; }
.chip.g { background: rgba(76, 195, 138, 0.15); color: #7fe0b0; } .chip.a { background: var(--amber-wash); color: #ffc977; }
.chip.b { background: rgba(90, 161, 240, 0.15); color: #9cc8ff; } .chip.r { background: rgba(239, 100, 97, 0.15); color: #ff9c99; }
.chip.v { background: rgba(165, 139, 240, 0.16); color: #c9b8ff; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.sp-b { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.row-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.center { justify-content: center; } .center-t { text-align: center; }

.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
.search { display: flex; align-items: center; gap: 8px; min-width: 220px; padding: 7px 12px; border: 1px solid var(--line-2); border-radius: 9px; color: var(--muted); background: var(--panel); }
.search.big { padding: 12px 14px; font-size: 15px; }
.fchip { padding: 6px 11px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--ink-2); font-size: 12.5px; font-weight: 600; }
.fchip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; color: var(--muted); font-weight: 700; font-size: 12px; padding: 9px 10px; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
.tbl td { padding: 10px; border-bottom: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td:first-child { color: var(--ink); font-weight: 700; }
.mx td, .mx th { text-align: center; } .mx td:first-child, .mx th:first-child { text-align: left; }
.ck { color: var(--green); font-weight: 800; } .no { color: var(--muted); }

.chart { display: grid; grid-template-columns: repeat(10, 1fr); gap: 8px; height: 170px; }
.cb { display: grid; grid-template-rows: 1fr auto; gap: 6px; height: 100%; }
.cb i { align-self: end; display: block; background: linear-gradient(var(--amber), rgba(242, 169, 59, 0.35)); border-radius: 6px 6px 2px 2px; }
.cb span { font-size: 10.5px; color: var(--muted); text-align: center; }
.hb { display: grid; grid-template-columns: 110px minmax(0, 1fr) 80px; align-items: center; gap: 10px; padding: 8px 0; }
.hb b { text-align: right; font-variant-numeric: tabular-nums; }
.bar { height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--amber); border-radius: 3px; }

.room { position: relative; border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; align-content: start;
  background: repeating-linear-gradient(0deg, transparent 0 39px, rgba(255, 255, 255, 0.03) 39px 40px), repeating-linear-gradient(90deg, transparent 0 39px, rgba(255, 255, 255, 0.03) 39px 40px), var(--panel); }
.room.vip { grid-template-columns: repeat(3, 1fr); }
.room .stage { grid-column: 1 / -1; height: 44px; border-radius: 10px; border: 1px dashed var(--line-2); display: grid; place-items: center; color: var(--muted); font-size: 12px; font-weight: 600; }
.tb { aspect-ratio: 1; border-radius: 14px; display: grid; place-items: center; font-weight: 800; border: 1.5px solid; position: relative; }
.room.vip .tb { aspect-ratio: 2 / 1; }
.tb small { position: absolute; bottom: 6px; font-size: 10px; font-weight: 700; opacity: 0.85; }
.tb.free { border-color: rgba(76, 195, 138, 0.5); color: #7fe0b0; background: rgba(76, 195, 138, 0.06); }
.tb.busy { border-color: rgba(242, 169, 59, 0.6); color: #ffc977; background: rgba(242, 169, 59, 0.08); }
.tb.res { border-color: rgba(90, 161, 240, 0.55); color: #9cc8ff; background: rgba(90, 161, 240, 0.07); }
.tb.svc { border-color: rgba(165, 139, 240, 0.6); color: #c9b8ff; background: rgba(165, 139, 240, 0.08); }
.tb.sel { box-shadow: 0 0 0 3px var(--amber); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--ink-2); font-size: 12px; margin-top: 10px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

.prof { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; flex-wrap: wrap; }
.avatar { width: 56px; height: 56px; border-radius: 50%; background: var(--amber-wash); color: var(--amber); display: grid; place-items: center; font-weight: 800; font-size: 18px; }
.prof h2 { margin: 0 0 6px; font-size: 18px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 4px 0 12px; overflow-x: auto; }
.tabs span { padding: 8px 12px; color: var(--muted); font-weight: 700; font-size: 13px; white-space: nowrap; }
.tabs .on { color: var(--ink); box-shadow: inset 0 -2px 0 var(--amber); }

.qrow { display: flex; align-items: center; gap: 10px; padding: 10px 4px; border-bottom: 1px solid var(--line); }
.qrow:last-child { border-bottom: 0; }
.qn { width: 20px; color: var(--muted); font-variant-numeric: tabular-nums; }
.av { width: 34px; height: 34px; border-radius: 50%; background: var(--panel-2); display: grid; place-items: center; font-weight: 800; font-size: 12px; color: var(--ink-2); flex: none; }
.huge { font-size: 54px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; letter-spacing: -0.02em; }
.big-name { font-size: 26px; font-weight: 800; margin: 10px 0 2px; }

.tcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.tcard { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 8px; }
.tcard .big { font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; }
.tcard.warn .big { color: var(--red); } .tcard.warn .bar i { background: var(--red); }

.cal { display: grid; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--panel); overflow-x: auto; }
.cal .c { padding: 8px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); min-height: 46px; font-size: 12px; }
.cal .hd { color: var(--muted); font-weight: 700; font-size: 11.5px; background: var(--panel-2); }
.blk { display: block; border-radius: 7px; padding: 3px 7px; font-size: 11.5px; font-weight: 700; background: var(--amber-wash); color: #ffc977; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.blk.b { background: rgba(90, 161, 240, 0.15); color: #9cc8ff; } .blk.v { background: rgba(165, 139, 240, 0.16); color: #c9b8ff; }

.lrow { display: grid; grid-template-columns: 52px 10px 170px 120px minmax(0, 1fr); align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.lrow:last-child { border-bottom: 0; }
.dot { width: 8px; height: 8px; border-radius: 50%; }
.dot.a { background: var(--amber); } .dot.g { background: var(--green); } .dot.b { background: var(--blue); } .dot.r { background: var(--red); }
.tn { font-variant-numeric: tabular-nums; }

.device { margin: 0 auto; background: #050506; border: 1px solid var(--line-2); box-shadow: 0 30px 60px rgba(0, 0, 0, 0.45); }
.device.tablet { max-width: 920px; border-radius: 32px; padding: 16px; }
.device.phone { max-width: 380px; border-radius: 46px; padding: 14px; }
.device .screen { background: var(--bg); border-radius: 18px; overflow: hidden; padding: 20px; min-height: 540px; }
.device.phone .screen { border-radius: 34px; min-height: 720px; padding: 18px 14px; display: flex; flex-direction: column; }
.big-btns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.big-btns.three { grid-template-columns: repeat(3, 1fr); }
.bigbtn { border-radius: 16px; padding: 24px 10px; text-align: center; font-weight: 800; font-size: 18px; border: 1px solid var(--line-2); background: var(--panel-2); }
.bigbtn.g { background: rgba(76, 195, 138, 0.18); color: #7fe0b0; border-color: rgba(76, 195, 138, 0.4); }
.bigbtn.a { background: var(--amber); color: #1a1205; border-color: var(--amber); }
.brow { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 14px; background: var(--panel); margin-bottom: 8px; font-size: 20px; }
.brow.now { background: var(--amber); color: #1a1205; } .brow.now .mut { color: #3a2a0c; }
.bn { font-weight: 800; width: 28px; }
.namegrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.namegrid span { padding: 14px 8px; border-radius: 12px; background: var(--panel); text-align: center; font-weight: 700; }
.namegrid .on { background: var(--amber); color: #1a1205; }
.callcard { text-align: center; padding: 70px 20px; border-radius: 20px; background: radial-gradient(circle at 50% 30%, rgba(242, 169, 59, 0.25), transparent 60%), var(--panel); display: grid; gap: 10px; justify-items: center; }
.callcard .big-name { font-size: 40px; }
.prow { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.prow:last-child { border-bottom: 0; }

.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.fld label { display: block; color: var(--muted); font-size: 12px; font-weight: 600; margin-bottom: 6px; }
.fld.wide { grid-column: 1 / -1; }
.inp { border: 1px solid var(--line-2); border-radius: 9px; padding: 9px 12px; background: var(--panel-2); color: var(--ink-2); min-height: 38px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.inp.area { min-height: 90px; align-items: flex-start; }
.inp.sm { min-height: 30px; padding: 5px 10px; font-size: 12.5px; display: inline-flex; }
.set-group { margin-bottom: 14px; }
.set-group h3 { font-size: 14px; margin: 0 0 6px; }
.set-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.set-row:last-child { border-bottom: 0; }
.tog { width: 38px; height: 22px; border-radius: 999px; background: rgba(255, 255, 255, 0.14); position: relative; flex: none; }
.tog::after { content: ""; position: absolute; width: 16px; height: 16px; border-radius: 50%; background: #fff; top: 3px; left: 3px; }
.tog.on { background: var(--amber); } .tog.on::after { left: 19px; }
.radio { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line-2); flex: none; }
.radio.on { border-color: var(--amber); background: var(--amber); box-shadow: inset 0 0 0 3px var(--panel); }

.cat { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.cat .it { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 4px; }
.cat .it span { color: var(--muted); font-size: 12px; }
.order .ln { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--line); }
.order .tot { display: flex; justify-content: space-between; font-size: 20px; font-weight: 800; padding: 12px 0; }
.drop { border: 1.5px dashed var(--line-2); border-radius: 16px; padding: 34px; display: grid; justify-items: center; gap: 6px; color: var(--ink-2); background: var(--panel); }
.drop svg { width: 26px; height: 26px; color: var(--amber); }
.maprow { display: grid; grid-template-columns: 1fr 20px 1fr; gap: 8px; align-items: center; margin-bottom: 8px; }
.kan { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(200px, 1fr); gap: 12px; overflow-x: auto; padding-bottom: 4px; }
.kcol { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 8px; align-content: start; }
.kcol h4 { margin: 0 0 4px; font-size: 13px; display: flex; justify-content: space-between; }
.kcard { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px; font-size: 12.5px; color: var(--ink-2); }
.kcard b { display: block; color: var(--ink); font-size: 13px; margin-bottom: 3px; }

.m-h { font-size: 21px; font-weight: 800; margin: 4px 0 12px; }
.m-card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 12px; margin-bottom: 10px; }
.m-row { display: flex; gap: 10px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--panel); border-radius: 10px; padding: 3px; margin-bottom: 12px; }
.seg span { text-align: center; padding: 7px; border-radius: 8px; font-size: 12.5px; color: var(--ink-2); font-weight: 600; }
.seg .on { background: var(--ink); color: var(--bg); }
.tabbar { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); margin: auto -14px -18px; padding: 12px 0 16px; text-align: center; font-size: 11.5px; font-weight: 600; color: var(--muted); }
.tabbar .on { color: var(--amber); }
.m-body { flex: 1; }
.login { max-width: 380px; width: 100%; margin: 0 auto; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 24px; display: grid; gap: 12px; align-content: start; }
.login .logo { font-size: 22px; margin: 0; }
.pins { display: flex; gap: 10px; justify-content: center; }
.pins i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line-2); }
.pin { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.pin span { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 14px; text-align: center; font-weight: 800; font-size: 18px; min-height: 54px; }

.map { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; align-items: start; }
.mcard { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
.mcard h3 { display: flex; align-items: center; gap: 8px; margin: 0 0 4px; font-size: 15px; }
.mcard h3 svg { width: 18px; height: 18px; color: var(--amber); }
.mcard p { margin: 0 0 8px; color: var(--muted); font-size: 12.5px; }
.mcard a { display: flex; justify-content: space-between; gap: 8px; color: var(--ink-2); text-decoration: none; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }
.mcard a:hover { color: var(--ink); }
.mcard a span:last-child { color: var(--muted); font-size: 11.5px; }
.sum-tiles { margin-bottom: 18px; }

@media (max-width: 1100px) { .cols-main { grid-template-columns: 1fr; } }
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .rail, .side { display: none; }
  .app.open .rail { display: flex; position: fixed; left: 0; top: 0; z-index: 30; }
  .app.open .side { display: flex; position: fixed; left: 0; top: 0; width: min(280px, 86vw); z-index: 30; }
  .app.open::after { content: ""; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.55); z-index: 20; }
  .btn.menu-btn { display: inline-flex; }
  .btn.menu-btn + .crumb { flex: 1; }
  .club { display: none; }
  .content { padding: 18px 14px 40px; }
  .cols2, .form { grid-template-columns: 1fr; }
  .big-btns { grid-template-columns: repeat(2, 1fr); }
  .namegrid { grid-template-columns: repeat(3, 1fr); }
  .lrow { grid-template-columns: 52px 10px minmax(0, 1fr); }
  .lrow > :nth-child(4), .lrow > :nth-child(5) { grid-column: 3; }
  .room { grid-template-columns: repeat(3, 1fr); }
  .device.tablet { padding: 8px; border-radius: 22px; }
  .device .screen { padding: 14px; }
  .top .btn span.lbl { display: none; }
}

/* The investor tour: a spotlight that glides from stop to stop, a caption card anchored beside it and pointing at it,
   and a title card to open and to close. The page underneath keeps running live. */
.tour { position: fixed; inset: 0; z-index: 45; pointer-events: none; animation: fadeIn 0.35s ease; }
.tour.away { display: none; }
.tour.out { opacity: 0; transition: opacity 0.3s ease; }
.tour-block { position: absolute; inset: 0; pointer-events: auto; }
.tour-spot { position: absolute; left: 0; top: 0; width: 100vw; height: 100vh; border-radius: 16px; box-shadow: 0 0 0 200vmax rgba(6, 7, 9, 0.7); will-change: transform; }
.tour-spot::before { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: 0 0 0 1.5px rgba(242, 169, 59, 0.95), 0 0 0 6px rgba(242, 169, 59, 0.12), 0 0 46px 4px rgba(242, 169, 59, 0.22); animation: spotGlow 2.8s ease-in-out infinite; }
@keyframes spotGlow { 50% { box-shadow: 0 0 0 1.5px rgba(242, 169, 59, 0.7), 0 0 0 10px rgba(242, 169, 59, 0.05), 0 0 64px 8px rgba(242, 169, 59, 0.15); } }
.tour-card { position: absolute; left: 0; top: 0; width: 376px; pointer-events: auto; display: grid; gap: 13px; padding: 14px; border-radius: 23px; background: #1b1c21; border: 1px solid rgba(255, 255, 255, 0.12); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 28px 70px rgba(0, 0, 0, 0.6); color: var(--ink); will-change: transform; }
.tour-card.enter { animation: cardIn 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
.tour-card.nudge { animation: cardNudge 0.45s cubic-bezier(0.2, 0.8, 0.2, 1); }
@keyframes cardIn { from { opacity: 0; scale: 0.96; } }
@keyframes cardNudge { 35% { scale: 1.03; } 70% { scale: 0.995; } }
.tc-arrow { position: absolute; width: 14px; height: 14px; background: #1b1c21; border: 1px solid rgba(255, 255, 255, 0.12); transform: rotate(45deg); display: none; animation: fadeIn 0.25s ease; }
.tour-card[data-side="right"] .tc-arrow { display: block; left: -9px; top: calc(var(--a, 40px) - 8px); border-top: 0; border-right: 0; }
.tour-card[data-side="left"] .tc-arrow { display: block; right: -9px; top: calc(var(--a, 40px) - 8px); border-bottom: 0; border-left: 0; }
.tour-card[data-side="bottom"] .tc-arrow { display: block; top: -9px; left: calc(var(--a, 40px) - 8px); border-bottom: 0; border-right: 0; }
.tour-card[data-side="top"] .tc-arrow { display: block; bottom: -9px; left: calc(var(--a, 40px) - 8px); border-top: 0; border-left: 0; }
.tc-top { position: relative; display: flex; align-items: center; gap: 11px; padding-right: 34px; }
.tc-ico { flex: none; width: 36px; height: 36px; display: grid; place-items: center; border-radius: 9px; color: var(--c, var(--amber)); background: color-mix(in srgb, var(--c, var(--amber)) 15%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c, var(--amber)) 30%, transparent); }
.tc-ico svg { width: 18px; height: 18px; }
.tc-eye { display: grid; gap: 2px; min-width: 0; }
.tc-eye b { font-size: 10.5px; font-weight: 800; letter-spacing: 0.09em; text-transform: uppercase; color: var(--c, var(--amber)); }
.tc-eye span { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tc-x { position: absolute; top: -7px; right: -7px; width: 30px; height: 30px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 50%; background: rgba(255, 255, 255, 0.06); color: var(--ink-2); cursor: pointer; transition: background 0.15s ease, color 0.15s ease, transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1); }
.tc-x:hover { background: rgba(255, 255, 255, 0.12); color: var(--ink); transform: rotate(90deg); }
.tc-x svg { width: 15px; height: 15px; }
.tc-body { display: grid; gap: 8px; }
.tc-body h3 { margin: 0; font-size: 19.5px; line-height: 1.2; font-weight: 800; letter-spacing: -0.018em; text-wrap: balance; }
.tc-body p { margin: 0; font-size: 13.5px; line-height: 1.55; color: var(--ink-2); text-wrap: pretty; }
.tc-watch { display: flex; align-items: flex-start; gap: 10px; margin-top: 2px; padding: 9px 12px; border-radius: 12px; background: rgba(242, 169, 59, 0.09); box-shadow: inset 0 0 0 1px rgba(242, 169, 59, 0.18); color: #f3c47a; font-size: 12.5px; font-weight: 600; line-height: 1.45; }
.tc-watch i { flex: none; width: 7px; height: 7px; margin-top: 6px; border-radius: 50%; background: var(--amber); animation: livePulse 1.8s ease-out infinite; }
@keyframes livePulse { 0% { box-shadow: 0 0 0 0 rgba(242, 169, 59, 0.4); } 70%, 100% { box-shadow: 0 0 0 7px rgba(242, 169, 59, 0); } }
.tc-body > * { animation: tcIn 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
.tc-body > :nth-child(2) { animation-delay: 0.06s; }
.tc-body > :nth-child(3) { animation-delay: 0.12s; }
@keyframes tcIn { from { opacity: 0; transform: translateY(7px); } }
.tc-segs { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 5px; margin: 1px 0 -2px; }
.tc-seg { position: relative; height: 14px; padding: 0; border: 0; background: none; cursor: pointer; }
.tc-seg::before, .tc-seg i { position: absolute; left: 0; top: 5px; height: 4px; border-radius: 2px; }
.tc-seg::before { content: ""; right: 0; background: rgba(255, 255, 255, 0.12); transition: background 0.15s ease; }
.tc-seg i { width: 0; background: var(--amber); }
.tc-seg.done i, .tc-seg.on i { width: 100%; }
.tour.playing .tc-seg.on i { width: var(--p, 0%); }
.tc-seg:hover::before { background: rgba(255, 255, 255, 0.26); }
.tc-seg span { position: absolute; bottom: calc(100% + 6px); left: 50%; translate: -50% 4px; padding: 4px 8px; border-radius: 7px; background: #2b2d34; color: var(--ink); font-size: 11.5px; font-weight: 700; white-space: nowrap; opacity: 0; pointer-events: none; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4); transition: opacity 0.15s ease, translate 0.2s ease; }
.tc-seg:hover span { opacity: 1; translate: -50% 0; }
.tc-seg:first-child span { left: 0; translate: 0 4px; }
.tc-seg:last-child span { left: auto; right: 0; translate: 0 4px; }
.tc-seg:first-child:hover span, .tc-seg:last-child:hover span { translate: 0 0; }
.tc-foot { display: flex; align-items: center; gap: 8px; }
.tc-n { min-width: 42px; font-size: 12.5px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.tc-n b { color: var(--ink); font-weight: 800; }
.tc-play { flex: none; width: 34px; height: 34px; display: grid; place-items: center; padding: 0; border-radius: 50%; border: 1px solid var(--line-2); background: var(--panel-2); color: var(--ink-2); cursor: pointer; transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease; }
.tc-play:hover { color: var(--ink); border-color: rgba(242, 169, 59, 0.5); }
.tc-play svg { width: 13px; height: 13px; }
.tc-play svg polygon, .tc-play svg rect, .tour-btn svg polygon, .ic-btns svg polygon { fill: currentColor; }
.tour.playing .tc-play { background: var(--amber-wash); border-color: rgba(242, 169, 59, 0.55); color: var(--amber); }
.tc-foot .btn { padding: 8px 13px; font-size: 13px; }
.tc-foot .btn svg { width: 15px; height: 15px; transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1); }
.tc-foot .btn.primary:hover { filter: brightness(1.07); }
.tc-foot .btn.primary:hover svg { transform: translateX(2px); }
.tc-foot .btn:not(.primary):not(:disabled):hover { border-color: rgba(255, 255, 255, 0.26); }
.tc-foot .btn:not(.primary):not(:disabled):hover svg { transform: translateX(-2px); }
.tc-foot .btn:disabled { opacity: 0.35; cursor: default; }
.tour-btn svg { width: 13px; height: 13px; }
.tour-card :focus-visible, .intro :focus-visible, .lang :focus-visible { outline: 2px solid rgba(242, 169, 59, 0.75); outline-offset: 2px; }
.tour-card .btn.primary:focus-visible, .intro .btn.primary:focus-visible { outline-color: rgba(255, 216, 160, 0.9); }
body.touring .content { padding-bottom: calc(48px + var(--tour-pad, 0px)); }

/* Opening and closing title cards. */
.intro { position: fixed; inset: 0; z-index: 50; display: flex; padding: 20px; overflow-y: auto; background: rgba(5, 6, 8, 0.62); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); animation: fadeIn 0.3s ease; }
.intro-card { position: relative; margin: auto; background: var(--panel); border: 1px solid var(--line-2); box-shadow: 0 40px 100px rgba(0, 0, 0, 0.6); animation: popIn 0.5s cubic-bezier(0.2, 0.8, 0.2, 1); }
@keyframes fadeIn { from { opacity: 0; } }
@keyframes popIn { from { opacity: 0; transform: translateY(14px) scale(0.97); } }
.intro-card.wide { width: min(940px, 100%); display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); overflow: hidden; border-radius: 26px; }
.ic-hero { position: relative; isolation: isolate; display: grid; align-content: start; gap: 18px; padding: 34px 34px 30px; }
.ic-hero::before { content: ""; position: absolute; z-index: -1; width: 460px; height: 460px; left: -170px; top: -210px; background: radial-gradient(closest-side, rgba(242, 169, 59, 0.2), rgba(242, 169, 59, 0)); }
.ic-hero::after { content: ""; position: absolute; z-index: -1; width: 380px; height: 380px; right: -190px; bottom: -220px; background: radial-gradient(closest-side, rgba(165, 139, 240, 0.12), rgba(165, 139, 240, 0)); }
.ic-brand { display: flex; align-items: center; gap: 12px; }
.ic-mark { width: 46px; height: 46px; display: grid; place-items: center; border-radius: 14px; background: linear-gradient(140deg, #f7bd5c, #e8892b); color: #1a1205; font-weight: 800; font-size: 13px; letter-spacing: 0.1em; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5), 0 12px 30px rgba(242, 169, 59, 0.3); }
.ic-hero h1 { margin: 0; font-size: 36px; line-height: 1.06; font-weight: 800; letter-spacing: -0.028em; text-wrap: balance; }
.ic-hero > p { margin: -4px 0 0; font-size: 15px; line-height: 1.55; color: var(--ink-2); text-wrap: pretty; }
.ic-pts { display: grid; gap: 11px; }
.ic-pts > div { display: grid; grid-template-columns: 34px minmax(0, 1fr); align-items: center; gap: 12px; font-size: 13.5px; line-height: 1.45; color: var(--ink-2); }
.ic-pts i { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 10px; background: var(--amber-wash); color: var(--amber); }
.ic-pts i svg { width: 17px; height: 17px; }
.ic-pts b { color: var(--ink); }
.ic-btns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 2px; }
.ic-btns .btn svg { width: 15px; height: 15px; }
.ic-keys { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.ic-keys span { margin-right: 8px; }
kbd { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 6px; background: var(--panel-2); border: 1px solid var(--line-2); border-bottom-width: 2px; font: 700 11px var(--font); color: var(--ink-2); }
.ic-route { display: grid; align-content: start; gap: 2px; padding: 28px 22px 24px; background: rgba(255, 255, 255, 0.018); border-left: 1px solid var(--line); }
.ic-route h2 { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 8px 10px; font-size: 11.5px; font-weight: 800; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
.ic-route h2 span { font-size: 12px; font-weight: 600; letter-spacing: 0; text-transform: none; }
.ic-stop { display: grid; grid-template-columns: 20px 34px minmax(0, 1fr) 16px; align-items: center; gap: 11px; padding: 7px 8px; border: 0; border-radius: 12px; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; transition: background 0.15s ease; }
.ic-stop:hover { background: rgba(255, 255, 255, 0.05); }
.ic-stop .n { font-size: 11.5px; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.ic-stop .t, .ic-recap .t { position: relative; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 10px; color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 28%, transparent); }
.ic-stop:not(:last-child) .t::after { content: ""; position: absolute; left: 50%; top: calc(100% + 3px); width: 1px; height: 8px; background: var(--line-2); }
.ic-stop .t svg, .ic-recap .t svg { width: 17px; height: 17px; }
.ic-stop b, .ic-recap b { display: block; font-size: 13.5px; font-weight: 700; color: var(--ink); }
.ic-stop small, .ic-recap small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: var(--muted); }
.ic-stop > svg { width: 16px; height: 16px; color: var(--muted); opacity: 0; transform: translateX(-4px); transition: opacity 0.2s ease, transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1); }
.ic-stop:hover > svg { opacity: 1; transform: none; }
.intro-card.end { width: min(660px, 100%); display: grid; gap: 20px; padding: 30px; border-radius: 26px; overflow: hidden; isolation: isolate; }
.intro-card.end::before { content: ""; position: absolute; z-index: -1; width: 420px; height: 420px; left: -150px; top: -220px; background: radial-gradient(closest-side, rgba(242, 169, 59, 0.18), rgba(242, 169, 59, 0)); }
.ic-done { width: 52px; height: 52px; display: grid; place-items: center; border-radius: 16px; background: linear-gradient(140deg, #f7bd5c, #e8892b); color: #1a1205; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5), 0 12px 30px rgba(242, 169, 59, 0.3); }
.ic-done svg { width: 26px; height: 26px; stroke-width: 2.6; }
.ic-head { display: grid; gap: 8px; }
.ic-head h1 { margin: 0; font-size: 32px; line-height: 1.1; font-weight: 800; letter-spacing: -0.025em; }
.ic-head p { margin: 0; font-size: 15px; line-height: 1.55; color: var(--ink-2); text-wrap: pretty; }
.ic-recap { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.ic-recap button { display: grid; grid-template-columns: 34px minmax(0, 1fr); align-items: center; gap: 11px; padding: 9px 10px; border-radius: 13px; border: 1px solid var(--line); background: var(--panel-2); color: inherit; font: inherit; text-align: left; cursor: pointer; transition: border-color 0.15s ease, transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1); }
.ic-recap button:hover { border-color: rgba(242, 169, 59, 0.4); transform: translateY(-1px); }
.ic-recap b { font-size: 13px; line-height: 1.3; }
.ic-cta { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.ic-cta .btn svg { width: 16px; height: 16px; }
.btn.ghost { background: none; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover { color: var(--ink); background: rgba(255, 255, 255, 0.05); }
.btn.offer { position: relative; isolation: isolate; overflow: hidden; border: 0; color: #fff; background: linear-gradient(140deg, #35196a 0%, #74288c 55%, #b5397a 100%); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.38), inset 0 0 0 1px rgba(255, 255, 255, 0.14), 0 10px 26px rgba(116, 40, 140, 0.45); transition: filter 0.15s ease, transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1); }
.btn.offer::after { content: ""; position: absolute; top: -30%; bottom: -30%; left: 0; width: 40%; z-index: -1; background: linear-gradient(90deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0)); transform: translateX(-160%) skewX(-18deg); animation: offerShine 5.5s ease-in-out infinite; }
.btn.offer:hover { filter: brightness(1.08); transform: translateY(-1px); }
@media (max-width: 760px) {
  .tour-card { left: 10px; right: 10px; top: auto; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); width: auto; gap: 11px; padding: 13px; border-radius: 22px; }
  .tc-arrow { display: none !important; }
  .tc-top { gap: 10px; }
  .tc-ico { width: 32px; height: 32px; }
  .tc-eye span { display: none; }
  .tc-body { gap: 6px; }
  .tc-body h3 { font-size: 17px; }
  .tc-body p { font-size: 13px; line-height: 1.5; }
  .tc-watch { padding: 7px 10px; font-size: 12px; }
  .tc-seg span { display: none; }
  .intro { padding: 12px; }
  .intro-card.wide { grid-template-columns: minmax(0, 1fr); border-radius: 22px; }
  .ic-hero { gap: 14px; padding: 24px 20px 20px; }
  .ic-hero h1 { font-size: 27px; }
  .ic-keys { display: none; }
  .ic-route { padding: 14px 12px 16px; border-left: 0; border-top: 1px solid var(--line); }
  .intro-card.end { gap: 16px; padding: 22px 18px; border-radius: 22px; }
  .ic-head h1 { font-size: 26px; }
  .ic-recap { grid-template-columns: minmax(0, 1fr); }
  .ic-cta .grow { display: none; }
}
.flash { animation: flash 1.2s ease; }
@keyframes flash { 0%, 35% { color: #7fe0b0; } }
.tb.flash { animation: tbPop 0.7s cubic-bezier(0.2, 0.8, 0.2, 1); }
@keyframes tbPop { 40% { transform: scale(1.08); } }
.tcard .big, .huge { font-variant-numeric: tabular-nums; }
.tcard.done { opacity: 0.5; }
.cat .it strong { margin-top: 2px; font-size: 16px; font-variant-numeric: tabular-nums; }
.order .ln b { font-variant-numeric: tabular-nums; }

/* One sidebar: six groups of the screens that tell the story, and everything else under All screens. */
.s-brand { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 4px 8px 2px; }
.s-brand .logo { margin: 0; font-size: 16px; }
.s-sec { display: grid; gap: 1px; }
.s-sec h4 { margin: 0 0 2px; padding: 0 8px; font-size: 10.5px; font-weight: 800; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
.s-sec a, .s-all { display: flex; align-items: center; gap: 10px; padding: 4px 8px; border-radius: 9px; color: var(--ink-2); text-decoration: none; font-size: 13px; font-weight: 600; transition: background 0.15s ease, color 0.15s ease; }
.s-sec a svg, .s-all svg { width: 16px; height: 16px; color: var(--muted); transition: color 0.15s ease; }
.s-sec a:hover, .s-all:hover { background: rgba(255, 255, 255, 0.05); color: var(--ink); }
.s-sec a.on, .s-all.on { background: var(--amber-wash); color: var(--ink); }
.s-sec a.on svg, .s-all.on svg { color: var(--amber); }
.s-nav { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 7px; margin: 0 -4px; padding: 0 4px; overflow-y: auto; scrollbar-width: none; }
.s-nav::-webkit-scrollbar { display: none; }
.s-foot { flex: none; display: grid; gap: 4px; padding-top: 12px; border-top: 1px solid var(--line); }
.s-all i { margin-left: auto; padding: 0 7px; border: 1px solid var(--line-2); border-radius: 999px; font-style: normal; font-size: 11px; color: var(--muted); }

/* Back to the offer: a shiny card in the offer's own purple-to-pink at the foot of the sidebar, with the offer's NOI mark,
   a glossy top and a light that sweeps across now and then. On a phone it floats at the bottom as a pill. */
.to-offer, .back-offer { position: relative; isolation: isolate; overflow: hidden; display: flex; align-items: center; gap: 11px; color: #ffffff; text-decoration: none; background: linear-gradient(140deg, #35196a 0%, #74288c 55%, #b5397a 100%); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.38), inset 0 0 0 1px rgba(255, 255, 255, 0.14), 0 10px 26px rgba(116, 40, 140, 0.45); transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.25s ease, filter 0.25s ease; }
.to-offer { margin-bottom: 6px; padding: 11px 12px; border-radius: 14px; }
.to-offer::before, .back-offer::before { content: ""; position: absolute; inset: 0 0 52% 0; z-index: -1; background: linear-gradient(180deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0)); }
.to-offer::after, .back-offer::after { content: ""; position: absolute; top: -30%; bottom: -30%; left: 0; width: 40%; z-index: -1; background: linear-gradient(90deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0)); transform: translateX(-160%) skewX(-18deg); animation: offerShine 5.5s ease-in-out infinite; }
@keyframes offerShine { 0%, 55% { transform: translateX(-160%) skewX(-18deg); } 85%, 100% { transform: translateX(340%) skewX(-18deg); } }
.to-offer:hover, .back-offer:hover { filter: brightness(1.08); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45), inset 0 0 0 1px rgba(255, 255, 255, 0.2), 0 14px 32px rgba(181, 57, 122, 0.5); }
.to-offer:hover { transform: translateY(-2px); }
.to-tile { flex: none; width: 38px; height: 38px; display: grid; place-items: center; border-radius: 11px; background: rgba(255, 255, 255, 0.16); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35); }
.to-tile svg { width: 22px; height: 22px; }
.to-txt { display: grid; gap: 1px; min-width: 0; }
.to-txt b { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 800; white-space: nowrap; }
.to-txt b svg { width: 15px; height: 15px; transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); }
.to-offer:hover .to-txt b svg, .back-offer:hover .to-txt b svg { transform: translateX(-3px); }
.to-txt small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11.5px; color: rgba(255, 255, 255, 0.78); }
.back-offer { display: none; }

/* Tonight: a twelve-column dashboard of live panels. */
.dash { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 14px; }
.dash > * { min-width: 0; }
.w12 { grid-column: span 12; } .w8 { grid-column: span 8; } .w6 { grid-column: span 6; } .w4 { grid-column: span 4; }
.dash-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; font-size: 12.5px; color: var(--muted); }
.dash-head b { color: var(--ink); font-variant-numeric: tabular-nums; }
.live-pill { display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px 4px 8px; border-radius: 999px; background: rgba(76, 195, 138, 0.12); color: #7fe0b0; font-size: 11px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; }
.live-pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--green); animation: livePulse 1.8s ease-out infinite; }
@keyframes livePulse { 0% { box-shadow: 0 0 0 0 rgba(76, 195, 138, 0.55); } 75%, 100% { box-shadow: 0 0 0 7px rgba(76, 195, 138, 0); } }
.shift { width: 120px; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
.shift i { display: block; height: 100%; border-radius: 3px; background: var(--amber); }
.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
.kpi { min-width: 0; display: grid; gap: 1px; padding: 12px 14px 10px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); }
.kpi-h span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: var(--muted); }
.kpi-v { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
.kpi-v b { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.kpi-v em { flex: none; font-style: normal; font-size: 11px; font-weight: 800; color: #7fe0b0; }
.kpi small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11.5px; color: var(--muted); }
.spark { display: block; width: 100%; height: 26px; margin-top: 6px; }
.ph-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.ph-h h3 { margin: 0; font-size: 13.5px; font-weight: 800; }
.ph-h span { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rev-chart { display: block; width: 100%; height: auto; }
.rev-chart text { fill: #7f848e; font: 600 11px var(--font); }
.now-bar { animation: nowBar 2.2s ease-in-out infinite; }
@keyframes nowBar { 50% { opacity: 0.7; } }
.lg { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 8px; font-size: 12px; color: var(--ink-2); }
.lg i { display: inline-block; width: 10px; height: 10px; margin-right: 6px; border-radius: 3px; vertical-align: -1px; }
.lg i.dash-line { width: 14px; height: 0; border-top: 2px dashed rgba(255, 255, 255, 0.5); border-radius: 0; vertical-align: 3px; }
.donut-wrap { display: grid; grid-template-columns: 132px minmax(0, 1fr); align-items: center; gap: 16px; }
.donut { display: block; width: 132px; height: 132px; }
.donut .d1 { fill: var(--ink); font: 800 18px var(--font); }
.donut .d2 { fill: var(--muted); font: 600 11px var(--font); }
.mrow { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto 34px; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.mrow:last-child { border-bottom: 0; }
.mrow i { width: 10px; height: 10px; border-radius: 3px; }
.mrow b, .mrow em { font-style: normal; font-variant-numeric: tabular-nums; }
.mrow em { text-align: right; font-size: 12px; color: var(--muted); }
.zone { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 5px 10px; padding: 5px 0; font-size: 13px; }
.zone b { font-variant-numeric: tabular-nums; }
.zone .bar { grid-column: 1 / -1; }
.dots { display: grid; gap: 7px; margin-top: 10px; padding-top: 12px; border-top: 1px solid var(--line); }
.dots div { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
.dots small { width: 60px; font-size: 11px; color: var(--muted); }
.dots i { width: 14px; height: 14px; border-radius: 4px; border: 1.5px solid; }
.dots .free { border-color: rgba(76, 195, 138, 0.6); background: rgba(76, 195, 138, 0.12); }
.dots .busy { border-color: rgba(242, 169, 59, 0.65); background: rgba(242, 169, 59, 0.14); }
.dots .res { border-color: rgba(90, 161, 240, 0.6); background: rgba(90, 161, 240, 0.12); }
.dots .svc { border-color: rgba(165, 139, 240, 0.65); background: rgba(165, 139, 240, 0.14); }
.stage-now { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; padding-bottom: 12px; margin-bottom: 2px; border-bottom: 1px solid var(--line); }
.stage-now .big-name { display: block; margin: 2px 0 0; font-size: 22px; }
.clock { font-size: 34px; font-weight: 800; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.srv { display: grid; gap: 6px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.srv:last-child { border-bottom: 0; }
.srv-h { display: flex; align-items: baseline; gap: 8px; font-size: 13px; }
.srv-h .tn { margin-left: auto; font-weight: 800; font-variant-numeric: tabular-nums; }
.srv .bar { height: 4px; }
.srv.warn .tn { color: var(--red); }
.srv.warn .bar i { background: var(--red); }
.srv.done { opacity: 0.5; }
.alert { display: grid; grid-template-columns: 8px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.alert:last-child { border-bottom: 0; }
.alert b { display: block; font-size: 13px; }
.alert small { font-size: 12px; color: var(--muted); }
.btn.sm { padding: 4px 10px; border-radius: 8px; font-size: 12px; }
.trow { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; align-items: center; gap: 4px 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.trow:last-child { border-bottom: 0; }
.trow .rk { font-weight: 800; color: var(--muted); }
.trow small { font-size: 12px; color: var(--muted); }
.trow b { font-variant-numeric: tabular-nums; }
.trow .bar { grid-column: 2 / -1; height: 4px; }
.stack { display: flex; gap: 2px; height: 10px; margin: 6px 0 2px; border-radius: 5px; overflow: hidden; }
.stack i { display: block; }
.mgr { display: flex; align-items: center; gap: 10px; padding: 5px 0; font-size: 13px; }
.mgr .av { width: 28px; height: 28px; font-size: 11px; }
.feed .frow { display: grid; grid-template-columns: 40px 8px minmax(0, 1fr); align-items: center; gap: 10px; margin: 0 -6px; padding: 8px 6px; border-bottom: 1px solid var(--line); border-radius: 8px; font-size: 13px; }
.feed .frow:last-child { border-bottom: 0; }
.feed .frow.new { animation: feedIn 0.6s cubic-bezier(0.2, 0.8, 0.2, 1), feedGlow 2.6s ease; }
@keyframes feedIn { from { opacity: 0; transform: translateY(-8px); } }
@keyframes feedGlow { 0%, 40% { background: rgba(242, 169, 59, 0.1); } }
.dot.v { background: var(--violet); }
.sys { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.sys > div { display: grid; gap: 3px; padding: 12px 14px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
.sys .sp-b b { font-size: 13.5px; color: var(--ink); }
@media (max-width: 1180px) {
  .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .w4 { grid-column: span 6; }
  .w8 { grid-column: span 12; }
  .sys { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 900px) {
  .w4, .w6, .w8 { grid-column: span 12; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .back-offer { display: flex; position: fixed; z-index: 35; left: 50%; bottom: 14px; transform: translateX(-50%); padding: 8px 18px 8px 8px; border-radius: 999px; }
  .back-offer:hover { transform: translateX(-50%) translateY(-2px); }
  .back-offer .to-tile { width: 32px; height: 32px; border-radius: 50%; }
  .back-offer .to-tile svg { width: 18px; height: 18px; }
  .back-offer .to-txt small { display: none; }
  .content { padding-bottom: 88px; }
  body.touring .back-offer, .app.open ~ .back-offer { display: none; }
  .panel.w6 .tbl { font-size: 12px; }
  .panel.w6 { overflow-x: auto; }
}

/* All screens, and the icon beside each screen's heading. */
.ptile { flex: none; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 13px; color: var(--c); background: color-mix(in srgb, var(--c) 15%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 32%, transparent); }
.ptile svg { width: 22px; height: 22px; }
.hrow { display: flex; align-items: flex-start; gap: 14px; }
.hrow .ptile { width: 42px; height: 42px; margin-top: 1px; border-radius: 12px; }
.sum-tiles .tile small { display: block; margin-top: 3px; font-size: 12px; color: var(--muted); }
.map-filter { margin: -4px 0 14px; }
.map-filter .fchip { display: inline-flex; align-items: center; gap: 7px; background: none; font-family: var(--font); cursor: pointer; transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease; }
.map-filter .fchip:not(.on):hover { border-color: rgba(255, 255, 255, 0.3); color: var(--ink); }
.map-filter .fchip.on { background: var(--ink); }
.map-filter .fchip i { font-style: normal; font-size: 11px; font-weight: 800; opacity: 0.6; }
.plist { display: grid; gap: 14px; }
.prod { display: grid; gap: 12px; padding: 18px; }
.prod[hidden] { display: none; }
.prod-h { display: flex; align-items: center; gap: 14px; }
.pmeta { display: grid; flex: 1; gap: 2px; min-width: 0; }
.pmeta b { font-size: 16px; font-weight: 800; }
.pwho { font-size: 12.5px; line-height: 1.4; color: var(--muted); }
.pfacts { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 10px; }
.pdev { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border: 1px solid var(--line-2); border-radius: 999px; font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.pdev svg { width: 13px; height: 13px; }
.pcount { font-size: 12px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.pnote { margin: 0; max-width: 820px; font-size: 13px; line-height: 1.5; color: var(--ink-2); }
.pscr { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; }
.pscr a { display: grid; align-content: start; gap: 4px; min-height: 76px; padding: 11px 12px; border-radius: 11px; background: var(--panel-2); border: 1px solid var(--line); color: var(--ink); text-decoration: none; transition: border-color 0.15s ease, background 0.15s ease, transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1); }
.pscr a:hover { border-color: color-mix(in srgb, var(--c) 45%, transparent); background: color-mix(in srgb, var(--c) 7%, var(--panel-2)); transform: translateY(-1px); }
.pscr .st { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.pscr .st b { font-size: 13.5px; font-weight: 700; line-height: 1.3; }
.pscr .st em { flex: none; padding: 2px 7px; border-radius: 999px; background: var(--amber-wash); color: var(--amber); font-size: 10.5px; font-style: normal; font-weight: 800; white-space: nowrap; }
.pscr .sd { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 12px; line-height: 1.45; color: var(--muted); }
@media (max-width: 900px) {
  .prod { padding: 14px; }
  .prod-h { flex-wrap: wrap; }
  .pfacts { width: 100%; justify-content: flex-start; padding-left: 58px; }
  .pscr { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .ptile { width: 40px; height: 40px; }
}

/* Language switch: Russian or English, in the top bar and on the opening card. */
.lang { position: relative; flex: none; display: inline-grid; grid-template-columns: 1fr 1fr; padding: 3px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); }
.lang button { position: relative; z-index: 1; min-width: 30px; padding: 4px 8px; border: 0; background: none; color: var(--muted); font: 800 11px var(--font); letter-spacing: 0.06em; cursor: pointer; transition: color 0.2s ease; }
.lang button:hover { color: var(--ink-2); }
.lang[data-on="ru"] button[data-lang="ru"], .lang[data-on="en"] button[data-lang="en"] { color: var(--ink); }
.lang i { position: absolute; top: 3px; bottom: 3px; left: 3px; width: calc(50% - 3px); border-radius: 7px; background: var(--panel-2); box-shadow: inset 0 0 0 1px var(--line-2), 0 1px 2px rgba(0, 0, 0, 0.3); transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); }
.lang[data-on="en"] i { transform: translateX(100%); }
.ic-brand .lang { background: rgba(255, 255, 255, 0.04); }
@media (max-width: 520px) { .top .club { display: none; } }
.panel:has(> .donut-wrap) { container-type: inline-size; }
@container (max-width: 330px) {
  .donut-wrap { grid-template-columns: minmax(0, 1fr); justify-items: center; gap: 10px; }
  .donut-wrap > div { width: 100%; }
}
@media (max-width: 1440px) { .dash .tbl th, .dash .tbl td { padding-left: 7px; padding-right: 7px; } }
.dash .w6.panel { overflow-x: auto; }
/* Buttons open mock dialogs: a form, a bill, a confirmation or a log, and a note on what would have happened. */
.dlg-wrap { position: fixed; inset: 0; z-index: 48; display: flex; padding: 20px; overflow-y: auto; background: rgba(5, 6, 8, 0.55); animation: fadeIn 0.2s ease; }
.dlg { margin: auto; width: min(520px, 100%); display: grid; gap: 14px; padding: 20px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line-2); box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55); animation: popIn 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); }
.dlg-h { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.dlg-h h3 { margin: 0; font-size: 18px; font-weight: 800; }
.dlg-h p { margin: 3px 0 0; font-size: 13px; }
.dlg-x { flex: none; width: 30px; height: 30px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 50%; background: rgba(255, 255, 255, 0.06); color: var(--ink-2); cursor: pointer; }
.dlg-x:hover { background: rgba(255, 255, 255, 0.12); color: var(--ink); }
.dlg-x svg { width: 15px; height: 15px; }
.dlg-n { margin: 0; font-size: 13.5px; line-height: 1.5; color: var(--ink-2); }
.dlg .set-row { cursor: pointer; }
.dlg-pins { justify-content: flex-start; }
.dlg-pins i { width: 40px; height: 46px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--panel-2); }
.dlg-btns { justify-content: flex-end; }
.dlg .btn { padding: 9px 14px; font-size: 13px; }
#content .bigbtn { cursor: pointer; }
.toast { position: fixed; left: 50%; bottom: 24px; z-index: 49; display: flex; align-items: center; gap: 10px; max-width: calc(100vw - 32px); padding: 11px 16px; border-radius: 12px; background: #23252b; border: 1px solid var(--line-2); box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5); font-size: 13.5px; font-weight: 700; transform: translateX(-50%); animation: toastIn 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); }
.toast svg { flex: none; width: 16px; height: 16px; color: var(--green); }
.toast small { font-weight: 600; color: var(--muted); }
.toast.out { opacity: 0; transition: opacity 0.3s ease; }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 8px); } }
@media (max-width: 760px) {
  .toast { bottom: 84px; flex-wrap: wrap; }
  .dlg { padding: 16px; }
  .dlg .form { grid-template-columns: minmax(0, 1fr); }
}
/* end of mock dialogs */
/* Inner screens in more detail: second lines, a footer under tables, a timeline row, the selected row and today's column. */
.sub { display: block; margin-top: 1px; font-size: 11.5px; font-weight: 500; color: var(--muted); }
.vstack { display: grid; gap: 14px; align-content: start; min-width: 0; }
.vstack > * { min-width: 0; }
.tbl tr.sel td { background: rgba(242, 169, 59, 0.06); }
.tbl tr.sel td:first-child { box-shadow: inset 2px 0 0 var(--amber); }
.tbl th .sub { margin-top: 0; }
.tfoot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 18px; padding: 10px; border-top: 1px solid var(--line-2); font-size: 12.5px; color: var(--muted); }
.tfoot b { color: var(--ink); font-variant-numeric: tabular-nums; }
.tl { display: grid; grid-template-columns: 44px 8px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.tl:last-child { border-bottom: 0; }
.tl small { display: block; font-size: 12px; color: var(--muted); }
.tl > b { font-variant-numeric: tabular-nums; }
.cal .today { background: rgba(242, 169, 59, 0.06); }
.cal .hd.today { color: var(--amber); }
.cal .tot { color: var(--ink); font-weight: 800; font-variant-numeric: tabular-nums; }
.blk.n { background: rgba(255, 255, 255, 0.07); color: var(--ink-2); }
.blk.r { background: rgba(239, 100, 97, 0.15); color: #ff9c99; }
.kcard .sp-b { margin-top: 8px; }
.kcard .av { width: 22px; height: 22px; font-size: 10px; }
.lgrp + .lgrp { margin-top: 16px; }
.prof .sub { margin-top: 7px; font-size: 12.5px; }
.panel.scroll { overflow-x: auto; }
.cols2 > .set-group { margin-bottom: 0; }
/* Every panel on Tonight leads to its full screen: tiles, headings, rows and status cards are links. */
a.kpi, a.zone, a.srv, a.trow, a.mgr, .sys > a { color: inherit; text-decoration: none; }
a.kpi { transition: border-color 0.15s ease, background 0.15s ease, transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1); }
a.kpi:hover { border-color: rgba(242, 169, 59, 0.4); background: var(--panel-2); transform: translateY(-2px); }
.ph-h h3 a { display: inline-flex; align-items: center; gap: 4px; color: inherit; text-decoration: none; transition: color 0.15s ease; }
.ph-h h3 a svg { width: 14px; height: 14px; color: var(--muted); transition: transform 0.2s ease, color 0.15s ease; }
.ph-h h3 a:hover, .ph-h h3 a:hover svg { color: var(--amber); }
.ph-h h3 a:hover svg { transform: translateX(2px); }
a.zone, a.srv, a.trow, a.mgr { margin: 0 -8px; padding-left: 8px; padding-right: 8px; border-radius: 8px; transition: background 0.15s ease; }
a.zone:hover, a.srv:hover, a.trow:hover, a.mgr:hover { background: rgba(255, 255, 255, 0.045); }
.sys > a { display: grid; gap: 3px; padding: 12px 14px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); font-size: 12.5px; color: var(--muted); transition: border-color 0.15s ease, transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1); }
.sys > a:hover { border-color: rgba(242, 169, 59, 0.4); transform: translateY(-2px); }
.alert a.btn.sm:hover { border-color: rgba(242, 169, 59, 0.55); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
/* Narrow screens and Russian: columns shrink below their content; wide tables and tab rows scroll inside their panels. */
.tl { grid-template-columns: 54px 8px minmax(0, 1fr) auto; }
@media (max-width: 1100px) { .cols-main { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 900px) { .panel:has(> .tbl) { overflow-x: auto; } }
@media (max-width: 520px) {
  .chart .cb span { font-size: 9.5px; }
  .chart .cb:nth-child(2n) span { visibility: hidden; }
}
/* end of narrow-screen fixes */

/* Version 1 and later: a badge in each screen's header, dots and a filter on All screens, a mark in the sidebar. */
.h1row { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; margin: 0 0 4px; }
.head .h1row h1 { margin: 0; }
.rel { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 800; white-space: nowrap; }
.rel::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.rel.r1 { background: rgba(76, 195, 138, 0.14); color: #7fe0b0; }
.rel.r2 { background: rgba(90, 161, 240, 0.15); color: #9cc8ff; }
.rel.r0 { background: rgba(255, 255, 255, 0.07); color: var(--ink-2); }
.rel.r0::before { background: none; box-shadow: inset 0 0 0 1.5px currentColor; }
.rel-n { font-size: 12.5px; color: var(--muted); }
.rdot { display: inline-block; flex: none; width: 7px; height: 7px; border-radius: 50%; margin-right: 7px; vertical-align: 1.5px; }
.rdot.r1 { background: var(--green); } .rdot.r2 { background: var(--blue); } .rdot.r0 { box-shadow: inset 0 0 0 1.5px var(--muted); }
.map-filter .fchip .rdot { margin-right: 0; }
.map-filter .fchip[data-rel].on .rdot.r0 { box-shadow: inset 0 0 0 1.5px var(--bg); }
.mf-sep { width: 1px; height: 20px; margin: 0 4px; background: var(--line-2); }
.pscr a[hidden], .prod[hidden] { display: none !important; }
.prel { font-size: 12px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.prel.r1 { color: #7fe0b0; } .prel.r2 { color: #9cc8ff; }
.s-sec a { padding-top: 3px; padding-bottom: 3px; }
.s-rel { margin-left: auto; padding: 0 6px; border: 1px solid var(--line-2); border-radius: 999px; font-style: normal; font-size: 10px; font-weight: 700; color: var(--muted); }
.club-sh { margin-left: 4px; padding-left: 9px; border-left: 1px solid var(--line-2); color: var(--ink-2); font-weight: 600; }

/* Rows with buttons on the right (approvals, alerts), the payment steps, device enrolment. */
.aprow { display: grid; grid-template-columns: 54px 8px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.aprow:last-child { border-bottom: 0; }
.aprow b { font-weight: 700; }
.aprow small { display: block; margin-top: 2px; font-size: 12px; color: var(--muted); }
.stps { display: inline-flex; gap: 4px; }
.stp { padding: 1px 7px; border: 1px dashed var(--line-2); border-radius: 999px; font-size: 11px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.stp.on { border: 1px solid transparent; background: rgba(76, 195, 138, 0.15); color: #7fe0b0; }
.enr { display: grid; gap: 8px; }
.enr-s { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.enr-n { display: grid; place-items: center; flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--panel-2); border: 1px solid var(--line-2); font-size: 11.5px; font-weight: 800; }
.enr-code { margin: 12px 0 6px; padding: 12px; border-radius: 12px; background: var(--panel-2); border: 1px dashed var(--line-2); text-align: center; font-size: 26px; font-weight: 800; letter-spacing: 0.16em; font-variant-numeric: tabular-nums; }

/* The stage board on a wall TV: a 16:9 screen, big type that scales with it, and a stand. */
.device.tv { max-width: 980px; border-radius: 16px; padding: 12px; }
.device.tv .screen { aspect-ratio: 16 / 9; min-height: 0; border-radius: 6px; padding: 0; background: #08090b; container-type: inline-size; }
.tv-stand { width: 22%; max-width: 220px; height: 30px; margin: 0 auto; background: linear-gradient(#141519, #0b0c0e); clip-path: polygon(30% 0, 70% 0, 100% 100%, 0 100%); }
.tvb { height: 100%; display: flex; flex-direction: column; gap: 2.2cqw; padding: 3cqw 3.4cqw; }
.tvb-top { display: flex; align-items: center; gap: 1.6cqw; font-size: max(12px, 1.7cqw); }
.tvb-top b { letter-spacing: 0.16em; color: var(--amber); }
.tvb-top .chip { font-size: max(11px, 1.45cqw); }
.tvb-clock-s { margin-left: auto; color: var(--ink-2); font-weight: 700; font-variant-numeric: tabular-nums; }
.tvb-main { flex: 1; display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); align-items: center; gap: 3cqw; padding: 2.4cqw 3cqw; border-radius: 2cqw; background: radial-gradient(circle at 22% 40%, rgba(242, 169, 59, 0.24), transparent 62%), #121317; }
.tvb-lbl { display: block; font-size: max(10px, 1.35cqw); font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.tvb-name { font-size: max(28px, 7.4cqw); font-weight: 800; line-height: 1.05; margin: 0.6cqw 0 0.4cqw; }
.tvb-sub { font-size: max(12px, 1.8cqw); color: var(--ink-2); }
.tvb-right { text-align: right; }
.tvb-time { font-size: max(36px, 10.5cqw); font-weight: 800; line-height: 1; color: var(--amber); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.tvb-next { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.6cqw; }
.tvb-next > div { display: grid; gap: 0.3cqw; padding: 1.4cqw 1.8cqw; border-radius: 1.4cqw; background: #131418; border: 1px solid var(--line); }
.tvb-next b { font-size: max(15px, 3cqw); font-weight: 800; }
.tvb-next > div > span:last-child { font-size: max(11px, 1.6cqw); color: var(--ink-2); }
.tvb-foot { display: flex; align-items: center; flex-wrap: wrap; gap: 0.8cqw 2.4cqw; font-size: max(11px, 1.6cqw); color: var(--ink-2); }
@media (max-width: 700px) {
  .device.tv .screen { aspect-ratio: auto; }
  .tvb { gap: 12px; padding: 14px; }
  .tvb-main { grid-template-columns: 1fr; gap: 10px; padding: 14px; }
  .tvb-right { text-align: left; }
  .tvb-next { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .aprow { grid-template-columns: 44px 8px minmax(0, 1fr); }
  .aprow > :nth-child(4) { grid-column: 3; justify-self: start; }
}

/* ---------------------------------------------------------------- helpers ---- */
const at = (a, i) => a[((i % a.length) + a.length) % a.length];
const usd = i => '$' + (((i * 37) % 19 + 3) * 140).toLocaleString('en-US');
const hm = i => `${String((20 + (i % 8)) % 24).padStart(2, '0')}:${String((i * 17) % 60).padStart(2, '0')}`;
const chip = (t, k = '') => `<span class="chip ${k}">${t}</span>`;
const tiles = arr => `<div class="tiles">${arr.map(([l, v]) => `<div class="tile"><span>${l}</span><b>${v}</b></div>`).join('')}</div>`;
const panel = (title, body, cls = '') => `<div class="panel ${cls}">${title ? `<h3 class="ph3">${title}</h3>` : ''}${body}</div>`;
const rows = items => `<div class="list">${items.map(x => `<div class="row">${x}</div>`).join('')}</div>`;
const fchips = (list = [], on = 0) => list.map((f, i) => `<span class="fchip${i === on ? ' on' : ''}">${f}</span>`).join('');
const toolbar = s => `<div class="toolbar"><div class="search">${ICON.search}<span>${s.find || 'Search'}</span></div>${fchips(s.filters, s.on)}<span class="grow"></span>${s.extra || ''}${s.action ? `<span class="btn primary">${ICON.plus}${s.action}</span>` : ''}</div>`;

const RULES = [
  [/status/i, i => { const s = at([['Active', 'g'], ['Pending', 'a'], ['Done', 'b'], ['On hold', '']], i); return chip(s[0], s[1]); }],
  [/^time$|opened|closed|^issued$|returned|updated/i, i => hm(i)],
  [/last visit|since|dates|period/i, i => at(['31 Oct', '28 Oct', '24 Oct', '19 Oct', '12 Oct', '2 Oct'], i)],
  [/^guest$/i, i => at(G, i)],
  [/^name$|person|cashier|issued to|swap with/i, i => at(N, i)],
  [/^shift$/i, i => '#' + (310 - i)],
  [/amount|spend|balance|deposit|price|accrued|to pay|expected|counted|^paid$|^left$|deductions/i, i => usd(i)],
  [/phone|contact/i, i => `+7 9•• •••-${String(10 + i * 7).slice(-2)}-${String(31 + i * 3).slice(-2)}`],
  [/party|visits|services|halls|^staff$/i, i => String(((i * 7) % 9) + 2)],
  [/^table$/i, i => 'T' + (((i * 5) % 22) + 1)],
  [/source/i, i => at(['Website', 'Phone', 'Promoter', 'Walk-in'], i)],
  [/^card$/i, i => at(['Gold', 'Silver', '—', 'Black'], i)],
  [/^role$/i, i => at(['Performer', 'Manager', 'Cashier', 'Hostess', 'Security'], i)],
  [/department/i, i => at(['Stage', 'Floor', 'Bar', 'Salon', 'Security'], i)],
  [/method/i, i => at(['Cash', 'Card', 'Transfer'], i)],
  [/service/i, i => at(['Sit-down 30', 'Private', 'Gulyat 1 h', 'Kletka 30', 'Group private'], i)],
  [/package/i, i => at(['30 min', '60 min', '2 h', 'Night'], i)],
  [/duration/i, i => at(['30 min', '60 min', '2 h', '4 h'], i)],
  [/share|discount/i, i => at(['40%', '50%', '10%', '15%'], i)],
  [/^rate$/i, i => at(['Per shift', 'Per shift', 'Share', 'Share + bonus'], i)],
  [/^type$/i, i => at(['Swap', 'Vacation', 'Sick leave'], i)],

const spark = (pts, color) => {
  const mx = Math.max(...pts), mn = Math.min(...pts);
  const xy = pts.map((v, i) => (i / (pts.length - 1) * 100).toFixed(1) + ',' + (25 - (v - mn) / (mx - mn || 1) * 21).toFixed(1)).join(' ');
  return `<svg class="spark" viewBox="0 0 100 28" preserveAspectRatio="none" aria-hidden="true"><polygon points="0,28 ${xy} 100,28" fill="${color}" fill-opacity="0.13"/><polyline points="${xy}" fill="none" stroke="${color}" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
};

// Revenue by hour: tonight's bars against last Friday's line, and last Friday's later hours as a dashed forecast.
function revChart() {
  const T = [640, 1420, 2380, 3960, 4080], L = [520, 1180, 2040, 3150, 3620, 3300, 2480, 1640, 820, 310];
  const X = i => 70 + i * 56, B = 172, top = 14, Y = v => B - v / 4500 * (B - top);
  let g = '';
  [0, 1500, 3000, 4500].forEach(v => { g += `<line x1="44" x2="596" y1="${Y(v)}" y2="${Y(v)}" stroke="rgba(255,255,255,0.06)"/><text x="36" y="${Y(v) + 4}" text-anchor="end">${v ? '$' + v / 1000 + 'k' : '$0'}</text>`; });
  ['20', '21', '22', '23', '00', '01', '02', '03', '04', '05'].forEach((h, i) => {
    g += i < T.length
      ? `<rect x="${X(i) - 15}" y="${Y(T[i])}" width="30" height="${B - Y(T[i])}" rx="6" fill="url(#gBar)"${i === T.length - 1 ? ' class="now-bar"' : ''}/>`
      : `<rect x="${X(i) - 15}" y="${Y(L[i])}" width="30" height="${B - Y(L[i])}" rx="6" fill="none" stroke="rgba(255,255,255,0.14)" stroke-dasharray="3 3"/>`;
    g += `<text x="${X(i)}" y="192" text-anchor="middle">${h}:00</text>`;
  });
  g += `<polyline points="${L.map((v, i) => X(i) + ',' + Y(v)).join(' ')}" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" stroke-dasharray="4 4"/>`
    + L.map((v, i) => `<circle cx="${X(i)}" cy="${Y(v)}" r="2.5" fill="#b8bbc2"/>`).join('');
  return `<svg class="rev-chart" viewBox="0 0 600 200" role="img" aria-label="Revenue by hour, tonight against last Friday"><defs><linearGradient id="gBar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6b54a"/><stop offset="1" stop-color="#f2a93b" stop-opacity="0.35"/></linearGradient></defs>${g}</svg>`;
}

function donut(mix) {
  const tot = mix.reduce((a, m) => a + m[1], 0), r = 54, C = 2 * Math.PI * r;
  let off = 0;
  const arcs = mix.map(([, v, c]) => {
    const len = v / tot * C;
    const arc = `<circle cx="70" cy="70" r="${r}" fill="none" stroke="${c}" stroke-width="16" stroke-dasharray="${(len - 2).toFixed(1)} ${(C - len + 2).toFixed(1)}" stroke-dashoffset="${(-off).toFixed(1)}" transform="rotate(-90 70 70)"/>`;
    off += len;
    return arc;
  }).join('');
  return `<svg class="donut" viewBox="0 0 140 140" role="img" aria-label="Revenue mix tonight"><circle cx="70" cy="70" r="${r}" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="16"/>${arcs}<text x="70" y="70" text-anchor="middle" class="d1">$12.5k</text><text x="70" y="88" text-anchor="middle" class="d2">tonight</text></svg>`;
}

  if (tour.at >= 0 && !tour.away) {

    else if (e.key === 'ArrowLeft') { e.preventDefault(); tourStep(-1); }

/* ---------------------------------------------------------------- live sample data ---- */
// Nothing here is real. Clocks count down, timers run and money ticks up, so the screens feel like a working night.
const mmss = sec => Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
const mmss2 = sec => String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0');
const stage = { left: 222, at: 0 };
let shownAt = 0;
function flash(el) { el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }

// Tile numbers count up from zero when a screen opens.
function countUp(el) {
  const m = el.textContent.match(/^(\$?)([\d,]+)( \/ \d+|%)?$/);
  if (!m || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const to = +m[2].replace(/,/g, ''), pre = m[1], post = m[3] || '', t0 = performance.now();
  const step = now => {
    const k = Math.min(1, (now - t0) / 900);
    el.textContent = pre + Math.round(to * (1 - Math.pow(1 - k, 3))).toLocaleString('en-US') + post;
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

// The stage: the clock, how long until each next performer, and whose name is where in the rotation.
function paintStage(moved) {
  document.querySelectorAll('[data-clock]').forEach(el => { el.textContent = mmss2(stage.left); });
  document.querySelectorAll('[data-in]').forEach(el => { el.textContent = mmss(stage.left + +el.dataset.in); });
  document.querySelectorAll('[data-stage]').forEach(el => {
    const name = N[(stage.at + +el.dataset.stage) % N.length], shown = lang === 'ru' && RU[name] ? RU[name] : name;
    if (el.textContent !== shown) { el.textContent = name; if (moved) flash(el); }
  });
}

function afterRender() {
  shownAt = performance.now();
  document.querySelectorAll('.tile b, .kpi b').forEach(countUp);
  // On the owner's screen, revenue and guests keep moving.
  document.querySelectorAll('.tile').forEach(t => {
    const label = t.querySelector('span') && t.querySelector('span').textContent;
    if (label === 'Revenue tonight') t.querySelector('b').dataset.money = '';
    if (label === 'Guests in the club') t.querySelector('b').dataset.count = '';
  });
  paintStage(false);
  tourPaint();
}

setInterval(() => {
  // When a set ends, the next performer goes on and every rotation view moves up.
  stage.left -= 1;
  if (stage.left < 0) { stage.at += 1; stage.left = 299; paintStage(true); } else paintStage(false);
  // Service timers run down; under five minutes a card turns red, and at zero it ends.
  document.querySelectorAll('[data-left]').forEach(el => {
    const left = Math.max(0, +el.dataset.left - 1), card = el.closest('.tcard, .srv'), bar = card && card.querySelector('.bar i');
    el.dataset.left = left;
    el.textContent = mmss2(left);
    if (bar) bar.style.width = Math.min(100, 100 - left / +el.dataset.total * 100).toFixed(1) + '%';
    if (card) { card.classList.toggle('warn', left < 300); card.classList.toggle('done', left === 0); }
  });
  // The night moves on a minute every 20 seconds, and the activity feed fills as things happen.
  night.tick += 1;
  if (night.tick % 20 === 0) { night.min += 1; document.querySelectorAll('[data-now]').forEach(el => { el.textContent = hhmm(night.min); }); }
  const feed = document.querySelector('.feed');
  if (feed && performance.now() - shownAt > 2500 && Math.random() < 0.16) addFeed(feed);
  if (performance.now() - shownAt < 1500) return;
  // Money comes in now and then, the odd guest arrives, and free tables fill up.
  document.querySelectorAll('[data-money]').forEach(el => {
    if (Math.random() < 0.3) { el.textContent = '$' + Math.round(+el.textContent.replace(/[^\d]/g, '') + 20 + Math.random() * 220).toLocaleString('en-US'); flash(el); }
  });
  document.querySelectorAll('[data-count]').forEach(el => { if (Math.random() < 0.08) { el.textContent = String(+el.textContent + 1); flash(el); } });
  const free = document.querySelectorAll('.room .tb.free');
  if (free.length > 2 && Math.random() < 0.08) {
    const tb = free[Math.floor(Math.random() * free.length)];
    tb.classList.replace('free', 'busy');
    tb.querySelector('small').textContent = (2 + Math.floor(Math.random() * 3)) + ' guests';
    flash(tb);
  }
}, 1000);
